# GitHub Issues Label Taxonomy — 35 Labels
# Single Source of Truth. Deploy via: ./scripts/label-sync.sh
# Public standard — used across all benediktkraus repos.

labels:
  # Status (6) — State Machine. Only ONE s:* label at a time.
  - name: "s:backlog"
    color: "D4C5F9"
    description: "Acknowledged, not yet ready for work"
  - name: "s:ready"
    color: "0E8A16"
    description: "Fully specified, can be picked up"
  - name: "s:running"
    color: "1D76DB"
    description: "Actively being worked on"
  - name: "s:blocked"
    color: "B60205"
    description: "Blocked by dependency or external factor"
  - name: "s:review"
    color: "FBCA04"
    description: "Work complete, awaiting review"
  - name: "s:done"
    color: "0E8A16"
    description: "Completed and verified"

  # Priority (4)
  - name: "p:critical"
    color: "B60205"
    description: "Immediate action required"
  - name: "p:high"
    color: "D93F0B"
    description: "Must be addressed this cycle"
  - name: "p:medium"
    color: "FBCA04"
    description: "Should be addressed soon"
  - name: "p:low"
    color: "C5DEF5"
    description: "Nice to have, no urgency"

  # Type (8)
  - name: "type:bug"
    color: "D73A4A"
    description: "Something is broken"
  - name: "type:feature"
    color: "A2EEEF"
    description: "New functionality"
  - name: "type:refactor"
    color: "D4C5F9"
    description: "Code improvement without behavior change"
  - name: "type:research"
    color: "0075CA"
    description: "Investigation, analysis, or decision"
  - name: "type:chore"
    color: "E4E669"
    description: "Maintenance, dependencies, cleanup"
  - name: "type:docs"
    color: "0075CA"
    description: "Documentation only"
  - name: "type:security"
    color: "B60205"
    description: "Security-related change"
  - name: "type:test"
    color: "BFD4F2"
    description: "Test-only change"

  # Agent (3)
  - name: "agent:auto"
    color: "1D76DB"
    description: "Can be fully executed by an agent"
  - name: "agent:assisted"
    color: "FBCA04"
    description: "Needs human input at specific steps"
  - name: "agent:human"
    color: "D93F0B"
    description: "Must be done by a human"

  # Architecture Layer (8)
  - name: "layer:data"
    color: "BFD4F2"
    description: "Database, storage, migrations"
  - name: "layer:api"
    color: "D4C5F9"
    description: "API endpoints, contracts, serialization"
  - name: "layer:logic"
    color: "0075CA"
    description: "Business logic, domain rules"
  - name: "layer:integration"
    color: "A2EEEF"
    description: "Third-party services, webhooks, connectors"
  - name: "layer:security"
    color: "D73A4A"
    description: "Auth, encryption, access control"
  - name: "layer:monitoring"
    color: "E4E669"
    description: "Logging, metrics, alerting"
  - name: "layer:ui"
    color: "BFD4F2"
    description: "Frontend, components, styling"
  - name: "layer:infra"
    color: "C5DEF5"
    description: "CI/CD, Docker, deployment, infrastructure"

  # Domain (3)
  - name: "domain:business"
    color: "0E8A16"
    description: "Strategy, marketing, sales, partnerships"
  - name: "domain:content"
    color: "A2EEEF"
    description: "Blog, newsletter, social, docs"
  - name: "domain:personal"
    color: "D4C5F9"
    description: "Personal admin tasks"

  # Special (1)
  - name: "human-gate"
    color: "B60205"
    description: "Must not be executed by automated agents"
